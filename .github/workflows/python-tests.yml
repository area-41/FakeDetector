name: PCA Detector CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python-headless scikit-learn matplotlib

    - name: Lint with flake8
      run: |
        pip install flake8
        # Para o workflow se houver erros de sintaxe Python ou símbolos indefinidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test PCA Logic
      run: |
        # Aqui você pode rodar um script de teste unitário 
        # Ou simplesmente verificar se o main.py executa sem erros fatais
        python -c "from main import PCADetector; print('Importação bem-sucedida')"
